[workspace]
resolver = "2"
members = ["crates/zaapy-core", "crates/zaapy-platform", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Miniluchi/zaapy"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
