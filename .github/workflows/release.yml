# Turns a version tag into installers. The version itself comes from the
# workspace Cargo.toml — tauri.conf.json deliberately has no version field, so
# there is one number to bump.
name: Release

on:
  push:
    tags: ["v*"]
  # Builds the installers without publishing anything, to check the packaging
  # before a tag is cut.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One DMG for both chips: an Intel Mac cannot run an Apple Silicon
          # build, and asking the user which one they have is a support burden.
          - name: macOS (universal)
            slug: macos-universal
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows (x64)
            slug: windows-x64
            runner: windows-latest
            targets: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Neither bundle is signed: Zaapy has no Apple Developer ID and no
      # Authenticode certificate, so Gatekeeper and SmartScreen both warn on
      # first launch. The README tells the user how to get past it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Empty on a manual run, which makes the action build and publish
          # nothing; the step below then keeps the bundles instead.
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || '' }}
          releaseName: Zaapy v__VERSION__
          releaseBody: |
            Zaapy is not code signed. On macOS, right-click the app and choose
            Open the first time; on Windows, click "More info" then "Run anyway".
          # Reviewed by hand before it goes out.
          releaseDraft: true
          prerelease: false

      # upload-artifact keeps every directory between the workspace root and
      # the file, which would bury the installer four levels deep inside the
      # download. Copying it out first puts it at the root of the archive.
      - name: Collect the installer
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          mkdir -p installers
          find target \( -name '*.dmg' -o -name '*-setup.exe' \) \
            -path '*/release/bundle/*' -exec cp {} installers/ \;

      # A GitHub release is the only place tauri-action uploads to, so without
      # this a manual run would build both installers and throw them away.
      - name: Keep the bundles from a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: zaapy-${{ matrix.slug }}
          if-no-files-found: error
          path: installers/*
